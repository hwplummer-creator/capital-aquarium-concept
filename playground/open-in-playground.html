listings.\\nadd_action(\\u0027woocommerce_after_shop_loop_item_title\\u0027, function () {\\n    global $product;\\n    if ($product \\u0026\\u0026 $product-\\u003emanaging_stock() \\u0026\\u0026 $product-\\u003eis_in_stock()) {\\n        $q = (int) $product-\\u003eget_stock_quantity();\\n        if ($q \\u003e 0 \\u0026\\u0026 $q \\u003c= 3) echo \\u0027\\u003cdiv class=\\"ca-low\\" style=\\"margin:0 16px\\"\\u003eOnly \\u0027 . $q . \\u0027 left\\u003c/div\\u003e\\u0027;\\n    }\\n}, 11);\\n\\n// Reservation mode: no shipping, and only \\"pay in store\\" at checkout.\\nadd_filter(\\u0027woocommerce_cart_needs_shipping\\u0027, \\u0027__return_false\\u0027);\\nadd_filter(\\u0027woocommerce_available_payment_gateways\\u0027, function ($g) {\\n    return isset($g[\\u0027cod\\u0027]) ? array(\\u0027cod\\u0027 =\\u003e $g[\\u0027cod\\u0027]) : $g;\\n});\\n"},{"step":"writeFile","path":"/wordpress/wp-content/ca-site.css","data":"/* Capital Aquarium concept: recolors the block theme and styles the custom homepage */\\n:root{\\n  --wp--preset--color--base:#06161f;\\n  --wp--preset--color--contrast:#e8f3f7;\\n  --wp--preset--color--accent-1:#27d3c3;\\n  --wp--preset--color--accent-2:#ff7a59;\\n  --wp--preset--color--accent-3:#27d3c3;\\n  --wp--preset--color--accent-4:#9bb8c4;\\n  --wp--preset--color--accent-5:#0e2d3d;\\n  --wp--preset--color--accent-6:#1b4558;\\n  --ca-bg2:#0a2330; --ca-card:#0e2d3d; --ca-line:#1b4558; --ca-muted:#9bb8c4;\\n  --ca-teal:#27d3c3; --ca-coral:#ff7a59; --ca-ink:#04121a;\\n}\\nhtml,body{background:#06161f!important;color:#e8f3f7}\\nbody{font-family:Inter,system-ui,-apple-system,\\"Segoe UI\\",Roboto,sans-serif}\\na{color:#27d3c3}\\n.ca-banner{background:#ffd966;color:#3a2f00;text-align:center;font-size:.82rem;padding:6px 12px;font-weight:600}\\n\\n/* header, nav, footer */\\n.wp-site-blocks\\u003eheader,.wp-block-template-part:first-child{border-bottom:1px solid var(--ca-line);background:rgba(6,22,31,.95)}\\n.wp-block-site-title a{color:#e8f3f7!i us:999px;font-weight:700;text-decoration:none;border:2px solid transparent;margin:0 12px 12px 0}\\n.ca-btn.p{background:#ff7a59;color:#04121a}\\n.ca-btn.g{border-color:#1b4558;color:#e8f3f7}\\n.ca-hero{position:relative;min-height:70vh;display:flex;align-items:center;overflow:hidden;background:linear-gradient(180deg,#073040,#06161f)}\\n.ca-hero::before{content:\\"\\";position:absolute;inset:0;background:url(\\"https://capitalaquarium.com/wp-content/uploads/photo-gallery/Reef-full-tank-shot.jpg\\") center/cover;opacity:.55}\\n.ca-hero::after{content:\\"\\";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,22,31,.95) 0%,rgba(6,22,31,.7) 45%,rgba(6,22,31,.15) 100%)}\\n.ca-hero .ca-wrap{position:relative;z-index:1;padding:70px 0}\\n.ca-hero h1{font-size:clamp(2.2rem,5.5vw,3.8rem);max-width:15ch;line-height:1.1;margin:0 0 .4em}\\n.ca-hero p{color:#cfe3ea;font-size:1.2rem;max-width:52ch}\\n.ca-pill{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:.9rem;color:#9bb8c4}\\n.ca-dot{width:10px;height:10px;border-radius:50%;background:#7a8c95}\\n.ca-dot.on{background:#3ddc84;box-shadow:0 0 0 4px rgba(61,220,132,.2)}\\n.ca-trust{background:#0a2330;border-block:1px solid #1b4558;padding:28px 0!important}\\n.ca-trust .g{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;text-align:center}\\n.ca-trust b{display:block;font-size:1.7rem;color:#27d3c3}\\n.ca-trust span{color:#9bb8c4;font-size:.9rem}\\n.ca-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:32px}\\n.ca-card{background:#0e2d3d;border:1px solid #1b4558;border-radius:16px;padding:28px}\\n.ca-card p{color:#9bb8c4}\\n.ca-card a.m{color:#27d3c3;font-weight:700;text-decoration:none}\\n.ca-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:32px;counter-reset:s}\\n.ca-step{padding:22px;border-left:3px solid #27d3c3;background:linear-gradient(90deg,rgba(39,211,195,.07),transparent)}\\n.ca-step::before{counter-increment:s;content:\\"0\\" c
